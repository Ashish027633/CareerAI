services:
  # Public AI Microservice (Python FastAPI)
  - type: web
    name: careerai-ai-service
    env: docker
    rootDir: ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true

  # Public Spring Boot Backend Gateway
  - type: web
    name: careerai-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://career-ai-orpin-kappa.vercel.app"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: careerai-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_API_KEY
        fromService:
          type: web
          name: careerai-ai-service
          envVarKey: API_KEY
