spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:careerai}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=REQUIRED
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CareerAiProdPool
      max-lifetime: 2000000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update # Production-safe strategy for initial migration; can be changed to validate later
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

app:
  seed-demo-data: ${SEED_DEMO_DATA:false}
