server:
  port: ${PORT:8080}

spring:
  application:
    name: careerai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# CareerAI Custom Application Properties
app:
  # Fallback for seed data if profile doesn't override
  seed-demo-data: ${SEED_DEMO_DATA:false}
  
  ai-service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    api-key: ${AI_API_KEY:dev-secret-key}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  security:
    jwt:
      # Use a secure random 256-bit+ base64 encoded secret in production
      secret: ${JWT_SECRET:CareerAI_Super_Secret_Key_For_Phase2_Local_Development_Only_Replace_In_Prod!}
      # 24 hours in milliseconds
      expiration: 86400000 
  
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
